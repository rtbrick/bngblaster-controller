version: "2"
linters:
  default: all
  # "all" keeps growing with every golangci-lint release; the linters below
  # are pure style preferences this codebase deliberately does not follow
  # (or are deprecated, or need per-project config that adds nothing here,
  # like depguard).
  disable:
    - depguard
    - err113
    - errchkjson
    - errorlint
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - gochecknoglobals
    - godoclint
    - gomodguard
    - lll
    - nestif
    - nlreturn
    - noinlineerr
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    godot:
      exclude:
        - '@.*'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - dupl
          - funlen
          - gocritic
          - lll
          - unparam
        path: _test.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/rtbrick)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
