openapi: 3.0.3
info:
  title: RtBrick BNG Blaster Conroller API
  description: >-
    RtBrick BNG Blaster Conroller API is the management API for multiple BNG Blaster instances.

    It allows to manage instances in the sense that new instances can be created, started, stopped 
    and also controlled via command socket of the BNG Blaster.

    The API does not require authentication. Every endpoint may answer `403` when a browser sends a
    state-changing request (`PUT`, `POST`, `DELETE`) on behalf of another site (`Sec-Fetch-Site` /
    `Origin` headers), or when the controller runs with `-allowed-hosts` and the `Host` header names
    a host that is not listed. Non-browser clients such as curl are not affected by the former.
  contact:
    email: bngblaster@rtbrick.com
    url: https://github.com/rtbrick/bngblaster-controller
  version: 1.1.0
servers:
  - url: 'http://localhost:8001'

paths:
  /metrics:
    get:
      summary: Metrics.
      description: >-
        Return metrics in prometheus text format.
      responses:
        200:
          description: ok
          content:
            text/plain:
              schema:
                type: string
  /api/v1/version:
    get:
      summary: BNG Blaster and Controller versions.
      description: >-
        Get versions of BNG Blaster and BNG Blaster Controller.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
                example:
                  {
                    "controller-version": "dev",
                    "blaster-version": "0.9.5",
                    "blaster-compiler": "GNU (11.4.0)",
                    "blaster-io-modes": [
                      "packet_mmap_raw",
                      "packet_mmap",
                      "raw"
                    ]
                  }    
  /api/v1/interfaces:
    get:
      summary: List network interfaces.
      description: >-
        Get list of all host network interfaces.

        Enabled by default; not available (404) if the controller is started with `-interfaces-api=false`.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example: [ 
                  { 
                    "name": "eth0", 
                    "mtu": 1500,
                    "flags": [
                      "up",
                      "broadcast",
                      "multicast"
                    ],
                    "mac": "aa:bb:cc:dd:ee:ff"
                  }
                ]
  /api/v1/host:
    get:
      summary: Host information.
      description: >-
        Get CPU, NUMA, memory and disk information of the host, the live CPU, memory and disk
        usage, and the CPUs pinned by bngblaster instances (based on their CPU lock files
        /run/lock/bngblaster_cpu<N>.<PID>.lock). Sizes are in bytes, usage in percent.

        A pin reports the instance of this controller if the process was started by it, otherwise
        only the PID.

        Enabled by default; not available (404) if the controller is started with `-host-api=false`.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
              example: {
                "hostname": "blaster",
                "kernel": "6.8.0-138-generic",
                "uptime": 3600.5,
                "load_average": [1.5, 0.75, 0.25],
                "cpu": {
                  "model": "AMD EPYC 9754 128-Core Processor",
                  "sockets": 2, "cores": 256, "threads": 512,
                  "usage": 12.5, "isolated": 64, "pinned": 4
                },
                "memory": {
                  "total": 1081627271168, "available": 1012345678848, "used": 69281592320,
                  "swap_total": 0, "swap_free": 0,
                  "hugepages_total": 0, "hugepages_free": 0, "hugepage_size": 2097152
                },
                "numa_nodes": [
                  { "id": 0, "cpus": [0, 1, 2], "memory_total": 540813635584, "memory_free": 500000000000 }
                ],
                "cpus": [
                  { "id": 2, "online": true, "node": 0, "socket": 0, "core": 2, "isolated": true,
                    "usage": 100, "pins": [ { "pid": 1234, "instance": "sample" } ] }
                ],
                "disks": [
                  { "mount": "/", "device": "/dev/nvme0n1p2", "fstype": "ext4",
                    "total": 1967317549056, "used": 401234567168, "available": 1466000000000 }
                ],
                "topology": true
              }
  /api/v1/host/interfaces:
    get:
      summary: Host network interfaces.
      description: >-
        Get the network interfaces of the host: physical interfaces, then SR-IOV virtual
        functions (with `pci.physical_function` and `pci.physical_function_interface` set to
        their physical function), then virtual interfaces. The details (kind,
        driver, firmware, permanent MAC, PCI device with vendor and device names, NUMA node and
        PCIe link) are discovered once per interface, at startup or when an interface appears.
        The state (MAC, MTU, link, speed in Mb/s, port, auto-negotiation, queues in use and the
        configured and maximum channels of `ethtool -l` and ring sizes of `ethtool -g`) is read
        on every request.

        ethtool is optional: without it, or if its output cannot be parsed, the values available
        in sysfs are reported; firmware, port, autoneg, channels and rings are then empty or null.
        Unknown values (e.g. speed while the link is down) are null.

        Enabled by default; not available (404) if the controller is started with `-host-api=false`.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
              example: {
                "ethtool": true,
                "interfaces": [
                  {
                    "name": "enp1s0f0np0", "kind": "pci", "physical": true,
                    "driver": "i40e", "driver_version": "6.8.0-138-generic",
                    "firmware": "9.56 0x8001011c 0.0.0", "permanent_mac": "64:9d:99:b1:83:f0",
                    "pci": {
                      "address": "0000:01:00.0", "vendor": "8086", "device": "1572",
                      "vendor_name": "Intel Corporation",
                      "device_name": "Ethernet Controller X710 for 10GbE SFP+",
                      "numa_node": 0,
                      "link_speed": "8.0 GT/s PCIe", "link_gen": 3, "link_width": 8,
                      "max_link_speed": "8.0 GT/s PCIe", "max_link_gen": 3, "max_link_width": 8
                    },
                    "mac": "64:9d:99:b1:83:f0", "mtu": 9000, "operstate": "up",
                    "carrier": true, "speed": 10000, "duplex": "full",
                    "port": "Direct Attach Copper", "autoneg": "off",
                    "rx_queues": 4, "tx_queues": 4,
                    "channels": {
                      "max": { "rx": null, "tx": null, "other": 1, "combined": 8 },
                      "current": { "rx": null, "tx": null, "other": 1, "combined": 4 }
                    },
                    "rings": {
                      "max": { "rx": 8160, "rx_mini": null, "rx_jumbo": null, "tx": 8160 },
                      "current": { "rx": 4096, "rx_mini": null, "rx_jumbo": null, "tx": 512 }
                    }
                  }
                ]
              }
  /api/v1/host/topology.png:
    get:
      summary: Hardware topology image.
      description: >-
        The hardware topology of the host (CPUs, caches, NUMA nodes, PCI devices) rendered by
        `lstopo` from hwloc as PNG. Rendered on demand and cached for 10 minutes.

        Not available (404) if lstopo is not installed or the controller is started with
        `-host-api=false`.
      responses:
        200:
          description: ok
          content:
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: not found, lstopo is not installed
          content:
            application/json:
              schema:
                type: object
        500:
          description: internal server error, lstopo failed
          content:
            application/json:
              schema:
                type: object
  /api/v1/schema:
    get:
      summary: BNG Blaster configuration JSON schema.
      description: >-
        Get the JSON schema used to render and validate the "New Instance" config editor in the web UI.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
        404:
          description: not found, schema not available
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances:
    get:
      summary: List of all instances.
      description: >-
        Get list of all instances.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["sample"]
  /api/v1/instances/{instance_name}:
    get:
      summary: Status information of an instance.
      description: >-
        Get status information of an instance. For the instance started with
        -autostart, the response also carries the state of the autostart, and
        it is returned even before the instance folder exists (instead of 404),
        e.g. while waiting for interfaces.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok, the status object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - started
                      - stopped
                  exit_code:
                    type: integer
                    description: >-
                      Exit code of the last run once the instance has stopped,
                      128+n if it was terminated by signal n. Left out while
                      running and when unknown (a run started before the
                      controller).
                    example: 0
                  autostart:
                    type: object
                    description: Only for the -autostart instance.
                    properties:
                      state:
                        type: string
                        enum:
                          - waiting-interfaces
                          - starting
                          - started
                          - failed
                      error:
                        type: string
                        description: Why the autostart failed.
        204:
          description: no content, the instance was updated
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        404:
          description: not found, if instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
    put:
      summary: Create or update an instance
      description: >-
        The bngblaster instance will be created if there is not already one.
        If the instance already exists the configuration is replaced.
        The instance will not be started only prepared.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      requestBody:
        description: The config file for the bngblaster instance.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: integer
                  - type: object
            example:
              {
                "interfaces": {
                  "network": {
                    "interface": "bblB",
                    "address": "10.0.0.10",
                    "gateway": "10.0.0.2",
                    "address-ipv6": "fc66:1337:7331:8::10",
                    "gateway-ipv6": "fc66:1337:7331:8::1"
                  },
                  "access": {
                    "interface": "bblA",
                    "outer-vlan-min": 1,
                    "outer-vlan-max": 4049,
                    "inner-vlan-min": 1,
                    "inner-vlan-max": 4049
                  }
                }
              }
      responses:
        201:
          description: created, the instance was created
        204:
          description: no content, the instance was updated
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        413:
          description: request entity too large, config exceeds 32 MB
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
    delete:
      summary: Delete an instance.
      description: >-
        Deletes an instance. This does not stop a running instance, only cleans up everything if the instance is already stopped.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        204:
          description: no content, the instance was deleted
        409:
          description: conflict, a generator is running in the instance folder
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_overview:
    get:
      summary: Aggregated overview of a running instance.
      description: >-
        Get the results of the bngblaster control socket commands "session-counters",
        "network-interfaces", "access-interfaces", "a10nsp-interfaces" and "test-info"
        in a single, briefly cached response. Used by the web UI's instance overview.

        Every key is always present; a command that is unsupported or not applicable
        for this instance yields null.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  session-counters:
                    type: object
                    nullable: true
                  network-interfaces:
                    type: array
                    nullable: true
                    items:
                      type: object
                  access-interfaces:
                    type: array
                    nullable: true
                    items:
                      type: object
                  a10nsp-interfaces:
                    type: array
                    nullable: true
                    items:
                      type: object
                  test-info:
                    type: object
                    nullable: true
                    description: >-
                      status, task, pid and startup-lock-pid are reported by bngblaster
                      versions that open the control socket at the beginning of the startup.
                      While starting or stopping, all other commands of this response are null.
                    properties:
                      state:
                        type: string
                        example: active
                      duration:
                        type: integer
                        description: seconds since the test has started, 0 while starting
                      status:
                        type: string
                        enum: [starting, running, stopping]
                      task:
                        type: string
                        example: wait-startup-lock
                      pid:
                        type: integer
                      startup-lock-pid:
                        type: integer
                        description: PID of the instance holding the startup lock while waiting for it
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is not running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_streams:
    get:
      summary: List traffic streams of a running instance.
      description: >-
        Get a paginated, optionally filtered view of the streams reported by the
        bngblaster "stream-summary" control socket command. Used by the web UI's
        virtual-scrolling stream table, which only ever requests the slice of rows
        currently in (or near) its viewport.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: offset
          description: number of streams to skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: maximum number of streams to return
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: session-id
          in: query
          required: false
          schema:
            type: integer
        - name: session-group-id
          in: query
          required: false
          schema:
            type: integer
        - name: flow-id
          in: query
          required: false
          schema:
            type: integer
        - name: flow-id-min
          description: lower bound of an explicit flow-id range; requires flow-id-max
          in: query
          required: false
          schema:
            type: integer
        - name: flow-id-max
          description: upper bound of an explicit flow-id range; requires flow-id-min
          in: query
          required: false
          schema:
            type: integer
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: interface
          in: query
          required: false
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - verified
              - bidirectional-verified
              - pending
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/streamsResponse'
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is not running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_sessions:
    get:
      summary: List sessions of a running instance.
      description: >-
        Get a paginated, optionally filtered view of the sessions reported by the
        bngblaster "session-summary" control socket command. Used by the web UI's
        virtual-scrolling session table, which only ever requests the slice of rows
        currently in (or near) its viewport.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: offset
          description: number of sessions to skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: maximum number of sessions to return
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: session-id
          in: query
          required: false
          schema:
            type: integer
        - name: session-group-id
          in: query
          required: false
          schema:
            type: integer
        - name: session-id-min
          description: lower bound of an explicit session-id range; requires session-id-max
          in: query
          required: false
          schema:
            type: integer
        - name: session-id-max
          description: upper bound of an explicit session-id range; requires session-id-min
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sessionsResponse'
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is not running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_logs:
    get:
      summary: Tail the log of a running instance.
      description: >-
        Poll for log lines appended to the instance's run.log since a previous
        call. Pass the "next_offset" from the previous response as the "offset"
        query parameter to only receive newly appended lines. If the instance was
        never started with logging enabled the response is an empty, EOF result
        rather than an error.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: offset
          description: byte offset into run.log to read from
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: maximum number of bytes to read
          in: query
          required: false
          schema:
            type: integer
            default: 131072
            maximum: 1048576
        - name: tail
          description: >-
            ignore offset and return the complete lines within the last "limit"
            bytes of run.log; for a viewer starting on (or far behind on) a
            large log, see "size"
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logsResponse'
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_start:
    post:
      summary: Start an instance
      description: >-
        The bngblaster instance will be started with the command line parameters provided in the body.

        The request waits until the instance has come up, so that an instance failing
        during its startup (e.g. due to an invalid configuration) is answered with 500 and
        its error output. With bngblaster versions reporting the startup via test-info,
        this is until the status is no longer "starting"; with older versions, until the
        control socket exists. There is no time limit, since an instance may wait for the
        startup of other instances. A startup can be aborted with the control socket command
        test-stop, or with _stop or _kill; the pending request is then answered with 409.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      requestBody:
        description: The command line parameters for the bngblaster.
        content:
          application/json:
            schema:
              type: object
              properties:
                report:
                  description: specifies that a report should be generated
                  type: boolean
                report_flags:
                  description: flags that allows to specify what is reported
                  type: array
                  items:
                    type: string
                    enum:
                      - sessions
                      - streams
                logging:
                  description: specifies if logging is enabled
                  type: boolean
                logging_flags:
                  description: flags that allows to specify what is logged
                  type: array
                  items:
                    type: string
                    enum:
                      - debug
                      - error
                      - igmp
                      - io
                      - pppoe
                      - info
                      - pcap
                      - ip
                      - loss
                      - l2tp
                      - dhcp
                      - isis
                      - ospf
                      - ldp
                      - bgp
                      - tcp
                      - lag
                      - dpdk
                      - af_xdp
                      - packet
                      - http
                pcap_capture:
                  description: allows to write a PCAP file
                  type: boolean
                session_count:
                  description: overwrites the session count from config
                  type: integer
                pppoe_session_count:
                  description: overwrites the session count from config
                  type: integer
                  deprecated: true
                stream_config:
                  description: >-
                    specifies an optional stream configuration file. An absolute path (starting with "/")
                    is used as-is; a relative path is resolved against the instance's directory and must
                    stay inside it, otherwise the request is rejected with 400.
                  type: string
                metric_flags:
                  description: flags that allows to specify what is exposed as metric
                  type: array
                  items:
                    type: string
                    enum:
                      - session_counters
                      - interfaces
                      - access_interfaces
                      - network_interfaces
                      - a10nsp_interfaces
                      - streams
            example:
              {
                "logging": true,
                "logging_flags": [ "error","ip" ],
                "pcap_capture": true,
                "session_count": 1000
              }
      responses:
        204:
          description: no content, the instance was started
        400:
          description: bad request, body not parsable or relative stream_config escapes the instance directory
          content:
            text/plain:
              schema:
                type: string
        413:
          description: request entity too large, body exceeds 1 MB
          content:
            application/json:
              schema:
                type: object
        404:
          description: not found, if instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
        409:
          description: conflict, the startup was aborted before the instance came up
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_stop:
    post:
      summary: Stop an instance
      description: >-
        Sends a stop signal to the instance
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        202:
          description: accepted
  /api/v1/instances/{instance_name}/_kill:
    post:
      summary: Kill an instance
      description: >-
        Sends a kill signal to the instance
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        202:
          description: accepted
  /api/v1/instances/{instance_name}/_command:
    post:
      summary: Send a command to the ctrl socket of the instance.
      description: >-
        The result of the command is a JSON datagram with a specific code field.
        This code field, if set, specifies the http response code.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      requestBody:
        description: The config file for the bngblaster instance.
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                arguments:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: integer
            example:
              {
                "command": "igmp-join",
                "arguments": {
                  "outer-vlan": 128,
                  "inner-vlan": 7,
                  "group": "232.1.1.3",
                  "source1": "10.0.0.10",
                  "source2": "10.0.0.11",
                  "source3": "10.0.0.12"
                }
              }
      responses:
        200:
          description: ok, if not other specified in the response of the bngblaster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commandResponse'
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        413:
          description: request entity too large, body exceeds 1 MB
          content:
            application/json:
              schema:
                type: object
        412:
          description: precondition failed, if instance is not running or not existent
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_files:
    get:
      summary: List downloadable files.
      description: >-
        List the files present in an instance's config folder, used by the web UI's
        download view.
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/instanceFile'
        404:
          description: not found, instance does not exist
  /api/v1/instances/{instance_name}/_files/{file_name}:
    get:
      summary: Download one of the files listed by _files.
      description: >-
        Serves a single file out of an instance's config folder. Unlike the fixed-name
        route registered for the well-known result files, this accepts any file name
        (e.g. user-uploaded files) since it only ever downloads names the _files
        endpoint itself just listed.
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: file_name
          description: name of the file to download, as returned by _files
          in: path
          required: true
          example: config.json
          schema:
            type: string
      responses:
        200:
          description: ok, with the content type applicable for the specific file ending.
        404:
          description: not found, instance or file does not exist
  /api/v1/instances/{instance_name}/{file_name}:
    get:
      summary: Download one of the output files.
      description: >-
        This allows to download the output but also the config files of an instance.
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: file_name
          description: name of the file to download
          in: path
          required: true
          example: config.json
          schema:
            type: string
            enum:
              - config.json
              - run.json
              - run.log
              - run_report.json
              - run.pcap
              - run.stdout
              - run.stderr
      responses:
        200:
          description: ok, with the content type applicable for the specific file ending.
        404:
          description: not found, file does not exist
  /api/v1/instances/{instance_name}/_upload:
    post:
      summary: Upload files.
      description: >-
        This API endpoint allows files to be uploaded into the test instance directory, 
        with a limit of 4GB per file.

        The files the controller itself manages for a run (`run.pid`, `run.sock`, `run.json`,
        `run.log`, `run_report.json`, `run.pcap`, `run.stdout`, `run.stderr`) cannot be uploaded,
        nor can names starting with `.gen-` or `.gen.bak-`, which are reserved for the temporary
        files of the generators.

        **Example:**
        `curl --location --request POST 'http://<host>:<port>/api/v1/instances/<instance_name>/_upload' --form 'file=@<local-filename>'`
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok, upload success
        400:
          description: error retrieving file, invalid or reserved filename
        403:
          description: forbidden, upload disabled (controller started with `-upload=false`)
        413:
          description: file too large (> 4000 MB)
        500:
          description: internal server error
        507:
          description: insufficient storage, the file does not fit on the controller's disk

  /api/v1/generators:
    get:
      summary: List the file generators.
      description: >-
        Lists the BNG Blaster file generators enabled on this controller (`lspgen`, `bgpupdate`,
        `ldpupdate`), whether each one is usable and the options it accepts. A tool is available
        if a cheap invocation succeeds (`lspgen --version`, `bgpupdate --help`), which also detects
        a missing Python or scapy installation. The result is cached for one minute.

        Only present if the controller runs with `-generators` (default).
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/generatorInfo'
        404:
          description: not found, generators disabled (`-generators=false`)
  /api/v1/instances/{instance_name}/_generate/{tool}:
    post:
      summary: Run a file generator in the instance folder.
      description: >-
        Runs `lspgen`, `bgpupdate` or `ldpupdate` with the instance folder as working directory,
        so the files it writes can be referenced by the instance configuration (e.g. the
        `mrt-file` of an ISIS/OSPF `external` section or a BGP/LDP `raw-update-file`) or, while
        the instance is running, loaded via the `_command` endpoint (`bgp-raw-update`,
        `ldp-raw-update`, `isis-load-mrt`, `ospf-load-mrt`).

        The request body is a JSON object keyed by the tool's long option names (see
        `GET /api/v1/generators` for the options of each tool). Flags take `true`, repeatable
        options a list. Unknown options are rejected, and file names must be plain names inside
        the instance folder; the controller's own files cannot be written. lspgen's control socket
        mode is not supported.

        Every file is written under a temporary name and moved into place only once the tool
        succeeded, so a failed run leaves nothing behind and the instance never reads a half-written
        file. A failed lspgen run also restores its sequence cache.

        While the instance is running, existing files are never replaced (`409`), since bngblaster
        loads RAW update files once per file name: use a new name for each further update.
        Only one generator runs per instance at a time. A run is aborted after 10 minutes.

        **Example:**
        `curl -X POST 'http://<host>:<port>/api/v1/instances/<instance_name>/_generate/bgpupdate'
        -d '{"next-hop-base": "10.0.0.1", "prefix-base": "11.0.0.0/24", "prefix-num": 1000, "file": "start.bgp"}'`
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: tool
          description: generator tool
          in: path
          required: true
          schema:
            type: string
            enum:
              - lspgen
              - bgpupdate
              - ldpupdate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: integer
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
            examples:
              lspgen:
                value:
                  connector: ["1921.6800.1001"]
                  node-count: 100
                  mrt-file: isis.mrt
                  stream-file: isis-streams.json
              bgpupdate:
                value:
                  next-hop-base: 10.0.0.1
                  prefix-base: 11.0.0.0/24
                  prefix-num: 1000
                  file: update-001.bgp
              ldpupdate:
                value:
                  lsr-id: 10.0.0.1
                  prefix-base: 11.0.0.0/24
                  prefix-num: 10
                  file: start.ldp
      responses:
        200:
          description: ok, the files were written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generateResponse'
        400:
          description: >-
            bad request, invalid option or value (only `message` is set), or an input file does not
            exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generateResponse'
        404:
          description: not found, instance does not exist, tool unknown or not enabled
        409:
          description: >-
            conflict, another generator is running for this instance, or an output file exists
            while the instance is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generateResponse'
        413:
          description: request too large
        422:
          description: the tool failed, see `stdout` and `stderr`; no file was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generateResponse'
        503:
          description: the tool is not installed or cannot be executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generateResponse'
        504:
          description: the tool was aborted after 10 minutes; no file was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generateResponse'

components:
  schemas:
    streamSummaryStream:
      type: object
      properties:
        flow-id:
          type: integer
        name:
          type: string
        type:
          type: string
        sub-type:
          type: string
        direction:
          type: string
        enabled:
          type: boolean
        active:
          type: boolean
        verified:
          type: boolean
        interface:
          type: string
        tx-packets:
          type: integer
        tx-bytes:
          type: integer
        rx-packets:
          type: integer
        rx-bytes:
          type: integer
        rx-loss:
          type: integer
        tx-pps:
          description: moving average TX rate in packets per second (two decimals)
          type: number
          format: double
        rx-pps:
          description: moving average RX rate in packets per second (two decimals)
          type: number
          format: double
        session-id:
          type: integer
        session-traffic:
          type: boolean
      example:
        {
          "flow-id": 1,
          "name": "stream1",
          "type": "ipv4",
          "sub-type": "raw",
          "direction": "upstream",
          "enabled": true,
          "active": true,
          "verified": true,
          "interface": "bblA",
          "tx-packets": 1000,
          "tx-bytes": 64000,
          "rx-packets": 1000,
          "rx-bytes": 64000,
          "rx-loss": 0,
          "tx-pps": 99.2,
          "rx-pps": 99.2,
          "session-id": 1,
          "session-traffic": false
        }
    streamsResponse:
      type: object
      properties:
        total:
          description: total number of streams matching the filters
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/streamSummaryStream'
      example:
        {
          "total": 1,
          "offset": 0,
          "limit": 50,
          "items": [
            {
              "flow-id": 1,
              "name": "stream1",
              "type": "ipv4",
              "sub-type": "raw",
              "direction": "upstream",
              "enabled": true,
              "active": true,
              "verified": true,
              "interface": "bblA",
              "tx-packets": 1000,
              "tx-bytes": 64000,
              "rx-packets": 1000,
              "rx-bytes": 64000,
              "rx-loss": 0,
              "tx-pps": 99.2,
              "rx-pps": 99.2,
              "session-id": 1,
              "session-traffic": false
            }
          ]
        }
    sessionSummarySession:
      type: object
      properties:
        type:
          type: string
        session-id:
          type: integer
        pppoe-session-id:
          type: integer
        session-state:
          type: string
        flapped:
          type: integer
        interface:
          type: string
        outer-vlan:
          type: integer
        inner-vlan:
          type: integer
        mac:
          type: string
        server-mac:
          type: string
        username:
          type: string
        ipv4-address:
          type: string
        lcp-state:
          type: string
        ipcp-state:
          type: string
        ip6cp-state:
          type: string
        dhcpv6-state:
          type: string
        tx-packets:
          type: integer
        rx-packets:
          type: integer
      example:
        {
          "type": "pppoe",
          "session-id": 1,
          "pppoe-session-id": 1,
          "session-state": "Established",
          "flapped": 0,
          "interface": "bblA",
          "outer-vlan": 1,
          "inner-vlan": 1,
          "mac": "aa:bb:cc:dd:ee:ff",
          "server-mac": "ff:ee:dd:cc:bb:aa",
          "username": "user1@rtbrick.com",
          "ipv4-address": "10.100.128.0",
          "lcp-state": "Opened",
          "ipcp-state": "Opened",
          "ip6cp-state": "Opened",
          "dhcpv6-state": "",
          "tx-packets": 1000,
          "rx-packets": 1000
        }
    sessionsResponse:
      type: object
      properties:
        total:
          description: total number of sessions matching the filters
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/sessionSummarySession'
      example:
        {
          "total": 1,
          "offset": 0,
          "limit": 50,
          "items": [
            {
              "type": "pppoe",
              "session-id": 1,
              "pppoe-session-id": 1,
              "session-state": "Established",
              "flapped": 0,
              "interface": "bblA",
              "outer-vlan": 1,
              "inner-vlan": 1,
              "mac": "aa:bb:cc:dd:ee:ff",
              "server-mac": "ff:ee:dd:cc:bb:aa",
              "username": "user1@rtbrick.com",
              "ipv4-address": "10.100.128.0",
              "lcp-state": "Opened",
              "ipcp-state": "Opened",
              "ip6cp-state": "Opened",
              "dhcpv6-state": "",
              "tx-packets": 1000,
              "rx-packets": 1000
            }
          ]
        }
    logsResponse:
      type: object
      properties:
        offset:
          description: byte offset the returned lines started at
          type: integer
        next_offset:
          description: pass this as the "offset" query parameter on the next poll
          type: integer
        size:
          description: >-
            current size of run.log; size - next_offset is how far the client
            is behind
          type: integer
        eof:
          description: true if next_offset has reached the current end of the log file
          type: boolean
        lines:
          type: array
          items:
            type: string
      example:
        {
          "offset": 0,
          "next_offset": 128,
          "size": 128,
          "eof": true,
          "lines": [
            "2025-01-01 00:00:00.000 INFO: bngblaster started"
          ]
        }
    instanceFile:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
      example:
        {
          "name": "run.log",
          "size": 1024
        }
    commandResponse:
      type: object
      properties:
        code:
          type: integer
        arguments:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
              - type: object
      example:
        {
          "status": "ok",
          "code": 200,
          "session-info": {
            "username": "user1@rtbrick.com",
            "agent-circuit_id": "0.0.0.0/0.0.0.0 eth 0:1",
            "agent-remote-id": "DEU.RTBRICK.1",
            "session-state": "PPP Established",
            "lcp-state": "Opened",
            "ipcp-state": "Opened",
            "ipv4-address": "10.100.128.0",
            "ip6cp-state": "Opened",
            "ipv6-prefix": "fc66:1000:1::",
            "ipv6-prefix-len": 64,
            "ipv6-delegated-prefix": "fc66:2000::",
            "ipv6-delegated-prefix-len": 56
          }
        }
    generatorOption:
      type: object
      properties:
        name:
          type: string
          description: long option name, also the key in a request
        type:
          type: string
          enum: [bool, int, number, string, enum, output, input]
          description: >-
            `output` is a file the tool writes, `input` an existing file of the instance it reads
        help:
          type: string
        group:
          type: string
        repeat:
          type: boolean
          description: takes a list, passed as one option per value
        join:
          type: boolean
          description: takes a list, passed comma-separated
        required:
          type: boolean
        enum:
          type: array
          items:
            type: string
        minimum:
          type: integer
        maximum:
          type: integer
        default:
          description: the tool's default
        appends:
          type: string
          description: the output option this flag makes the tool append to
        conflicts:
          type: string
          description: an option that cannot be given together with this one
        suffixes:
          type: array
          items:
            type: string
          description: the value is a base name the tool appends these suffixes to
    generatorInfo:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        executable:
          type: string
        available:
          type: boolean
        version:
          type: string
        error:
          type: string
          description: why the tool is not available
        options:
          type: array
          items:
            $ref: '#/components/schemas/generatorOption'
    generateResponse:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
          description: the files written, by their final names
        command:
          type: string
          description: the command line that was run
        exit_code:
          type: integer
        stdout:
          type: string
          description: the last 256 KiB of the tool's standard output
        stderr:
          type: string
          description: the last 256 KiB of the tool's standard error
        duration_ms:
          type: integer
        message:
          type: string
          description: set if the run did not succeed
      example:
        {
          "files": ["start.bgp"],
          "command": "bgpupdate --next-hop-base=10.0.0.1 --prefix-base=11.0.0.0/24 --prefix-num=1000 --file=start.bgp",
          "exit_code": 0,
          "stdout": "[INFO   ] init 1000 IPv4 prefixes\n[INFO   ] finished\n",
          "stderr": "",
          "duration_ms": 398
        }
