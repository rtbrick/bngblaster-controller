openapi: 3.0.3
info:
  title: RtBrick BNG Blaster Conroller API
  description: >-
    RtBrick BNG Blaster Conroller API is the management API for multiple BNG Blaster instances.

    It allows to manage instances in the sense that new instances can be created, started, stopped 
    and also controlled via command socket of the BNG Blaster.
  contact:
    email: bngblaster@rtbrick.com
    url: https://github.com/rtbrick/bngblaster-controller
  version: 0.1.3
servers:
  - url: 'http://localhost:8001'

paths:
  /metrics:
    get:
      summary: Metrics.
      description: >-
        Return metrics in prometheus text format.
      responses:
        200:
          description: ok
          content:
            text/plain:
              schema:
                type: string
  /api/v1/version:
    get:
      summary: BNG Blaster and Controller versions.
      description: >-
        Get versions of BNG Blaster and BNG Blaster Controller.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
                example:
                  {
                    "controller-version": "dev",
                    "blaster-version": "0.9.5",
                    "blaster-compiler": "GNU (11.4.0)",
                    "blaster-io-modes": [
                      "packet_mmap_raw",
                      "packet_mmap",
                      "raw"
                    ]
                  }    
  /api/v1/interfaces:
    get:
      summary: List network interfaces.
      description: >-
        Get list of all host network interfaces.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example: [ 
                  { 
                    "name": "eth0", 
                    "mtu": 1500,
                    "flags": [
                      "up",
                      "broadcast",
                      "multicast"
                    ],
                    "mac": "aa:bb:cc:dd:ee:ff"
                  }
                ]
  /api/v1/schema:
    get:
      summary: BNG Blaster configuration JSON schema.
      description: >-
        Get the JSON schema used to render and validate the "New Instance" config editor in the web UI.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: object
        404:
          description: not found, schema not available
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances:
    get:
      summary: List of all instances.
      description: >-
        Get list of all instances.
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["sample"]
  /api/v1/instances/{instance_name}:
    get:
      summary: Status information of an instance.
      description: >-
        Get status information of an instance.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok, the status object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - started
                      - stopped
        204:
          description: no content, the instance was updated
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        404:
          description: not found, if instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
    put:
      summary: Create or update an instance
      description: >-
        The bngblaster instance will be created if there is not already one.
        If the instance already exists the configuration is replaced.
        The instance will not be started only prepared.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      requestBody:
        description: The config file for the bngblaster instance.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: integer
                  - type: object
            example:
              {
                "interfaces": {
                  "network": {
                    "interface": "bblB",
                    "address": "10.0.0.10",
                    "gateway": "10.0.0.2",
                    "address-ipv6": "fc66:1337:7331:8::10",
                    "gateway-ipv6": "fc66:1337:7331:8::1"
                  },
                  "access": {
                    "interface": "bblA",
                    "outer-vlan-min": 1,
                    "outer-vlan-max": 4049,
                    "inner-vlan-min": 1,
                    "inner-vlan-max": 4049
                  }
                }
              }
      responses:
        201:
          description: created, the instance was created
        204:
          description: no content, the instance was updated
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
    delete:
      summary: Delete an instance.
      description: >-
        Deletes an instance. This does not stop a running instance, only cleans up everything if the instance is already stopped.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        204:
          description: no content, the instance was deleted
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_streams:
    get:
      summary: List traffic streams of a running instance.
      description: >-
        Get a paginated, optionally filtered view of the streams reported by the
        bngblaster "stream-summary" control socket command. Used by the web UI's
        virtual-scrolling stream table, which only ever requests the slice of rows
        currently in (or near) its viewport.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: offset
          description: number of streams to skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: maximum number of streams to return
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: session-id
          in: query
          required: false
          schema:
            type: integer
        - name: session-group-id
          in: query
          required: false
          schema:
            type: integer
        - name: flow-id
          in: query
          required: false
          schema:
            type: integer
        - name: flow-id-min
          description: lower bound of an explicit flow-id range; requires flow-id-max
          in: query
          required: false
          schema:
            type: integer
        - name: flow-id-max
          description: upper bound of an explicit flow-id range; requires flow-id-min
          in: query
          required: false
          schema:
            type: integer
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: interface
          in: query
          required: false
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - verified
              - bidirectional-verified
              - pending
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/streamsResponse'
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is not running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_sessions:
    get:
      summary: List sessions of a running instance.
      description: >-
        Get a paginated, optionally filtered view of the sessions reported by the
        bngblaster "session-summary" control socket command. Used by the web UI's
        virtual-scrolling session table, which only ever requests the slice of rows
        currently in (or near) its viewport.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: offset
          description: number of sessions to skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: maximum number of sessions to return
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: session-id
          in: query
          required: false
          schema:
            type: integer
        - name: session-group-id
          in: query
          required: false
          schema:
            type: integer
        - name: session-id-min
          description: lower bound of an explicit session-id range; requires session-id-max
          in: query
          required: false
          schema:
            type: integer
        - name: session-id-max
          description: upper bound of an explicit session-id range; requires session-id-min
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sessionsResponse'
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is not running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_logs:
    get:
      summary: Tail the log of a running instance.
      description: >-
        Poll for log lines appended to the instance's run.log since a previous
        call. Pass the "next_offset" from the previous response as the "offset"
        query parameter to only receive newly appended lines. If the instance was
        never started with logging enabled the response is an empty, EOF result
        rather than an error.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: offset
          description: byte offset into run.log to read from
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          description: maximum number of bytes to read
          in: query
          required: false
          schema:
            type: integer
            default: 65536
            maximum: 1048576
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logsResponse'
        404:
          description: not found, instance does not exist
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_start:
    post:
      summary: Start an instance
      description: >-
        The bngblaster instance will be started with the command line parameters provided in the body.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      requestBody:
        description: The command line parameters for the bngblaster.
        content:
          application/json:
            schema:
              type: object
              properties:
                report:
                  description: specifies that a report should be generated
                  type: boolean
                report_flags:
                  description: flags that allows to specify what is reported
                  type: array
                  items:
                    type: string
                    enum:
                      - sessions
                      - streams
                logging:
                  description: specifies if logging is enabled
                  type: boolean
                logging_flags:
                  description: flags that allows to specify what is logged
                  type: array
                  items:
                    type: string
                    enum:
                      - debug
                      - error
                      - igmp
                      - io
                      - pppoe
                      - info
                      - pcap
                      - ip
                      - loss
                      - l2tp
                      - dhcp
                      - isis
                      - ospf
                      - ldp
                      - bgp
                      - tcp
                      - lag
                      - dpdk
                      - packet
                      - http
                      - timer
                      - timer-detail
                pcap_capture:
                  description: allows to write a PCAP file
                  type: boolean
                session_count:
                  description: overwrites the session count from config
                  type: integer
                pppoe_session_count:
                  description: overwrites the session count from config
                  type: integer
                  deprecated: true
                stream_config:
                  description: specifies an optional stream configuration file. An absolute path (starting with "/") is used as-is; a relative path is resolved against the instance's directory.
                  type: string
                metric_flags:
                  description: flags that allows to specify what is exposed as metric
                  type: array
                  items:
                    type: string
                    enum:
                      - session_counters
                      - interfaces
                      - access_interfaces
                      - network_interfaces
                      - a10nsp_interfaces
                      - streams
            example:
              {
                "logging": true,
                "logging_flags": [ "error","ip" ],
                "pcap_capture": true,
                "session_count": 1000
              }
      responses:
        204:
          description: no content, the instance was started
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        404:
          description: not found, if instance does not exist
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is running
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_stop:
    post:
      summary: Stop an instance
      description: >-
        Sends a stop signal to the instance
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        202:
          description: accepted
  /api/v1/instances/{instance_name}/_kill:
    post:
      summary: Kill an instance
      description: >-
        Sends a kill signal to the instance
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        202:
          description: accepted
  /api/v1/instances/{instance_name}/_command:
    post:
      summary: Send a command to the ctrl socket of the instance.
      description: >-
        The result of the command is a JSON datagram with a specific code field.
        This code field, if set, specifies the http response code.
      parameters:
        - name: instance_name
          description: instance name of the bngblaster
          in: path
          required: true
          example: sample
          schema:
            type: string
      requestBody:
        description: The config file for the bngblaster instance.
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                arguments:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: integer
            example:
              {
                "command": "igmp-join",
                "arguments": {
                  "outer-vlan": 128,
                  "inner-vlan": 7,
                  "group": "232.1.1.3",
                  "source1": "10.0.0.10",
                  "source2": "10.0.0.11",
                  "source3": "10.0.0.12"
                }
              }
      responses:
        200:
          description: ok, if not other specified in the response of the bngblaster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commandResponse'
        400:
          description: bad request, body not parsable
          content:
            text/plain:
              schema:
                type: string
        412:
          description: precondition failed, if instance is not running or not existent
          content:
            text/plain:
              schema:
                type: string
        500:
          description: internal server error
          content:
            text/plain:
              schema:
                type: string
  /api/v1/instances/{instance_name}/_files:
    get:
      summary: List downloadable files.
      description: >-
        List the files present in an instance's config folder, used by the web UI's
        download view.
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/instanceFile'
        404:
          description: not found, instance does not exist
  /api/v1/instances/{instance_name}/_files/{file_name}:
    get:
      summary: Download one of the files listed by _files.
      description: >-
        Serves a single file out of an instance's config folder. Unlike the fixed-name
        route registered for the well-known result files, this accepts any file name
        (e.g. user-uploaded files) since it only ever downloads names the _files
        endpoint itself just listed.
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: file_name
          description: name of the file to download, as returned by _files
          in: path
          required: true
          example: config.json
          schema:
            type: string
      responses:
        200:
          description: ok, with the content type applicable for the specific file ending.
        404:
          description: not found, instance or file does not exist
  /api/v1/instances/{instance_name}/{file_name}:
    get:
      summary: Download one of the output files.
      description: >-
        This allows to download the output but also the config files of an instance.
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
        - name: file_name
          description: name of the file to download
          in: path
          required: true
          example: config.json
          schema:
            type: string
            enum:
              - config.json
              - run.json
              - run.log
              - run_report.json
              - run.pcap
              - run.stdout
              - run.stderr
      responses:
        200:
          description: ok, with the content type applicable for the specific file ending.
        404:
          description: not found, file does not exist
  /api/v1/instances/{instance_name}/_upload:
    post:
      summary: Upload files.
      description: >-
        This API endpoint allows files to be uploaded into the test instance directory, 
        with a limit of 4GB per file.

        **Example:**
        `curl --location --request POST 'http://<host>:<port>/api/v1/instances/<instance_name>/_upload' --form 'file=@<local-filename>'`
      parameters:
        - name: instance_name
          description: instance name of the parsable
          in: path
          required: true
          example: sample
          schema:
            type: string
      responses:
        200:
          description: ok, upload success
        400:
          description: error retrieving file
        403:
          description: forbidden, controller not started with upload flag
        413:
          description: file to large (> 4GB)
        500:
          description: internal server error

components:
  schemas:
    streamSummaryStream:
      type: object
      properties:
        flow-id:
          type: integer
        name:
          type: string
        type:
          type: string
        sub-type:
          type: string
        direction:
          type: string
        enabled:
          type: boolean
        active:
          type: boolean
        verified:
          type: boolean
        interface:
          type: string
        tx-packets:
          type: integer
        tx-bytes:
          type: integer
        rx-packets:
          type: integer
        rx-bytes:
          type: integer
        rx-loss:
          type: integer
        tx-pps:
          type: integer
        rx-pps:
          type: integer
        session-id:
          type: integer
        session-traffic:
          type: boolean
      example:
        {
          "flow-id": 1,
          "name": "stream1",
          "type": "ipv4",
          "sub-type": "raw",
          "direction": "upstream",
          "enabled": true,
          "active": true,
          "verified": true,
          "interface": "bblA",
          "tx-packets": 1000,
          "tx-bytes": 64000,
          "rx-packets": 1000,
          "rx-bytes": 64000,
          "rx-loss": 0,
          "tx-pps": 100,
          "rx-pps": 100,
          "session-id": 1,
          "session-traffic": false
        }
    streamsResponse:
      type: object
      properties:
        total:
          description: total number of streams matching the filters
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/streamSummaryStream'
      example:
        {
          "total": 1,
          "offset": 0,
          "limit": 50,
          "items": [
            {
              "flow-id": 1,
              "name": "stream1",
              "type": "ipv4",
              "sub-type": "raw",
              "direction": "upstream",
              "enabled": true,
              "active": true,
              "verified": true,
              "interface": "bblA",
              "tx-packets": 1000,
              "tx-bytes": 64000,
              "rx-packets": 1000,
              "rx-bytes": 64000,
              "rx-loss": 0,
              "tx-pps": 100,
              "rx-pps": 100,
              "session-id": 1,
              "session-traffic": false
            }
          ]
        }
    sessionSummarySession:
      type: object
      properties:
        type:
          type: string
        session-id:
          type: integer
        pppoe-session-id:
          type: integer
        session-state:
          type: string
        flapped:
          type: integer
        interface:
          type: string
        outer-vlan:
          type: integer
        inner-vlan:
          type: integer
        mac:
          type: string
        server-mac:
          type: string
        username:
          type: string
        ipv4-address:
          type: string
        lcp-state:
          type: string
        ipcp-state:
          type: string
        ip6cp-state:
          type: string
        dhcpv6-state:
          type: string
        tx-packets:
          type: integer
        rx-packets:
          type: integer
      example:
        {
          "type": "pppoe",
          "session-id": 1,
          "pppoe-session-id": 1,
          "session-state": "Established",
          "flapped": 0,
          "interface": "bblA",
          "outer-vlan": 1,
          "inner-vlan": 1,
          "mac": "aa:bb:cc:dd:ee:ff",
          "server-mac": "ff:ee:dd:cc:bb:aa",
          "username": "user1@rtbrick.com",
          "ipv4-address": "10.100.128.0",
          "lcp-state": "Opened",
          "ipcp-state": "Opened",
          "ip6cp-state": "Opened",
          "dhcpv6-state": "",
          "tx-packets": 1000,
          "rx-packets": 1000
        }
    sessionsResponse:
      type: object
      properties:
        total:
          description: total number of sessions matching the filters
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/sessionSummarySession'
      example:
        {
          "total": 1,
          "offset": 0,
          "limit": 50,
          "items": [
            {
              "type": "pppoe",
              "session-id": 1,
              "pppoe-session-id": 1,
              "session-state": "Established",
              "flapped": 0,
              "interface": "bblA",
              "outer-vlan": 1,
              "inner-vlan": 1,
              "mac": "aa:bb:cc:dd:ee:ff",
              "server-mac": "ff:ee:dd:cc:bb:aa",
              "username": "user1@rtbrick.com",
              "ipv4-address": "10.100.128.0",
              "lcp-state": "Opened",
              "ipcp-state": "Opened",
              "ip6cp-state": "Opened",
              "dhcpv6-state": "",
              "tx-packets": 1000,
              "rx-packets": 1000
            }
          ]
        }
    logsResponse:
      type: object
      properties:
        offset:
          description: byte offset the returned lines started at
          type: integer
        next_offset:
          description: pass this as the "offset" query parameter on the next poll
          type: integer
        eof:
          description: true if next_offset has reached the current end of the log file
          type: boolean
        lines:
          type: array
          items:
            type: string
      example:
        {
          "offset": 0,
          "next_offset": 128,
          "eof": true,
          "lines": [
            "2025-01-01 00:00:00.000 INFO: bngblaster started"
          ]
        }
    instanceFile:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
      example:
        {
          "name": "run.log",
          "size": 1024
        }
    commandResponse:
      type: object
      properties:
        code:
          type: integer
        arguments:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
              - type: object
      example:
        {
          "status": "ok",
          "code": 200,
          "session-info": {
            "username": "user1@rtbrick.com",
            "agent-circuit_id": "0.0.0.0/0.0.0.0 eth 0:1",
            "agent-remote-id": "DEU.RTBRICK.1",
            "session-state": "PPP Established",
            "lcp-state": "Opened",
            "ipcp-state": "Opened",
            "ipv4-address": "10.100.128.0",
            "ip6cp-state": "Opened",
            "ipv6-prefix": "fc66:1000:1::",
            "ipv6-prefix-len": 64,
            "ipv6-delegated-prefix": "fc66:2000::",
            "ipv6-delegated-prefix-len": 56
          }
        }
