name: Build

on:
  push:
    paths-ignore:
    - 'docs/**'

  pull_request:
    paths-ignore:
    - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.27"

    - name: Build
      run: make build

    - name: Test
      run: make test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # only-new-issues reads the pull request diff
      pull-requests: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.27"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0
        # The prebuilt v2.14 binaries are built with Go 1.26 and refuse to
        # load a module targeting Go 1.27; build it with the Go set up above
        # instead. Switch back to the default binary install once a release
        # built with Go >= 1.27 is out.
        install-mode: goinstall
        # The code predates most of the linters "default: all" now enables;
        # fail on issues introduced by a change instead of the whole backlog.
        only-new-issues: true
